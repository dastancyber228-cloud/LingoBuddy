<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LingoBuddy – Your AI Language Companion</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#eef6fb;--surface:#fff;--text:#14296b;--muted:#5b6785;--line:#d5e3ef;--brand:#f58220;--brand-d:#d96d10;--brand-t:#fff;--accent:#1f4fb2;--soft:#fff0e0;--bot:#e8f0fa;--me:#1f4fb2;--me-t:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1a33;--surface:#17254a;--text:#eaf1ff;--muted:#a3b2d4;--line:#2b3c68;--brand:#ff9a3d;--brand-d:#f58220;--brand-t:#0f1a33;--accent:#8fb0ff;--soft:#3a2f2a;--bot:#22335f;--me:#4a78e8;--me-t:#fff}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1a33;--surface:#17254a;--text:#eaf1ff;--muted:#a3b2d4;--line:#2b3c68;--brand:#ff9a3d;--brand-d:#f58220;--brand-t:#0f1a33;--accent:#8fb0ff;--soft:#3a2f2a;--bot:#22335f;--me:#4a78e8;--me-t:#fff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.55}
.wrap{max-width:1000px;margin:0 auto;padding:16px 20px}
header{display:flex;align-items:center;justify-content:space-between;padding:4px 0 14px}
.logo{font-weight:800;font-size:1.3rem;display:flex;gap:10px;align-items:center;cursor:pointer}
.logo img{width:44px;height:44px;border-radius:12px;object-fit:cover}
button{font:inherit;cursor:pointer}
.btn{background:var(--brand);color:var(--brand-t);border:0;border-radius:14px;padding:12px 22px;font-weight:800}
.btn:hover{background:var(--brand-d)}.btn:disabled{opacity:.5}
.btn.ghost{background:transparent;color:var(--text);border:2px solid var(--line)}
.btn.ghost:hover{border-color:var(--brand)}
.hero{display:grid;gap:24px;grid-template-columns:1.1fr .9fr;align-items:center;padding:16px 0 30px}
.hero h1{font-size:clamp(2rem,5vw,3rem);line-height:1.1;margin:0 0 14px}
.hero h1 em{color:var(--brand);font-style:normal}
.hero p{color:var(--muted);font-size:1.1rem;margin:0 0 22px}
.hero img{width:100%;max-width:420px;justify-self:center;border-radius:28px;border:2px solid var(--line)}
.features{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:18px}
.card h3{margin:6px 0}.card p{margin:0;color:var(--muted)}
.panel{max-width:540px;margin:8px auto;background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:26px}
.panel h2{margin-top:0}
.steps{display:flex;gap:6px;margin-bottom:18px}.steps i{flex:1;height:6px;border-radius:6px;background:var(--line)}.steps i.on{background:var(--brand)}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.role{border:3px solid var(--line);background:var(--bg);color:var(--text);border-radius:20px;padding:20px 10px;text-align:center}
.role .e{font-size:2.3rem;display:block}.role b{display:block}.role small{color:var(--muted)}
.role[aria-pressed="true"]{border-color:var(--brand);background:var(--soft)}
label{display:block;font-weight:700;margin:14px 0 6px}
input,select{width:100%;font:inherit;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--text)}
input:focus,select:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:1px}
.note{background:var(--soft);border-radius:14px;padding:12px 14px;font-size:.92rem;margin-top:16px}
.row{display:flex;gap:10px;justify-content:space-between;margin-top:22px}
.err{color:#d6336c;font-weight:700;font-size:.9rem;min-height:1.2em;margin-top:8px}
.chip{display:inline-block;background:var(--soft);border-radius:999px;padding:3px 12px;font-weight:700;font-size:.85rem}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;padding:0}
.dash{display:grid;grid-template-columns:270px 1fr;gap:14px}
.side .card{margin-bottom:12px;padding:14px}
.side .btn{width:100%}
.hist{display:flex;flex-direction:column;gap:6px;margin-top:10px;max-height:300px;overflow-y:auto}
.h{display:flex;align-items:center;border:2px solid var(--line);border-radius:12px;background:var(--bg)}
.h.on{border-color:var(--brand);background:var(--soft)}
.h button.o{flex:1;text-align:left;background:none;border:0;color:var(--text);padding:8px 10px;min-width:0}
.h .t{display:block;font-weight:700;font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h small{color:var(--muted)}
.h button.x{background:none;border:0;color:var(--muted);padding:8px 10px}
.chat{display:flex;flex-direction:column;height:min(72vh,660px);padding:0;overflow:hidden}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
.b{padding:10px 14px;border-radius:16px;max-width:88%;white-space:pre-wrap}
.b.bot{background:var(--bot);align-self:flex-start}.b.me{background:var(--me);color:var(--me-t);align-self:flex-end}
.quick{display:flex;gap:8px;flex-wrap:wrap;padding:8px 12px 0}
.quick button{background:var(--bg);color:var(--text);border:2px solid var(--line);border-radius:999px;padding:6px 12px;font-size:.88rem}
.quick button:hover{border-color:var(--brand)}
.composer{display:flex;gap:8px;padding:12px}
.composer input{flex:1}
@media (max-width:780px){.hero,.dash{grid-template-columns:1fr}.chat{height:68vh}.hist{max-height:150px}}
</style>
</head>

const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
const opts=(a,s)=>a.map(x=>`<option${x===s?" selected":""}>${x}</option>`).join("");
async function hash(s){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("lingo:"+s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return btoa(unescape(encodeURIComponent(s)))}}
const accounts=()=>ls.get("lingo_accounts",{});
const keyOf=s=>s.trim().toLowerCase();
const saveChats=()=>ls.set("lingo_chats_"+keyOf(me.id),chats);

function login(){
  nav.innerHTML="";
  app.innerHTML=`<div class="panel"><h2>Welcome back 👋</h2>
   <label for="id">Email (parents) or nickname (kids)</label><input id="id" autocomplete="username">
   <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password">
   <div class="err" id="err"></div>
   <div class="row"><button class="btn ghost" id="b">Back</button><button class="btn" id="go">Log in</button></div>
   <p style="text-align:center"><button class="link" id="c">New here? Create an account</button></p></div>`;
  document.getElementById("b").onclick=landing;
  document.getElementById("c").onclick=()=>{reg={};register(1)};
  const go=async()=>{
    const k=keyOf(document.getElementById("id").value),a=accounts()[k],err=document.getElementById("err");
    if(!a||a.hash!==await hash(k+document.getElementById("pw").value))return err.textContent="We couldn’t find that account or password.";
    start(a);
  };
  document.getElementById("go").onclick=go;
  document.getElementById("pw").onkeydown=e=>{if(e.key==="Enter")go()};
}

function register(step){
  nav.innerHTML="";
  const bar=`<div class="steps"><i class="on"></i><i class="${step>1?"on":""}"></i><i class="${step>2?"on":""}"></i></div>`,p=reg.role==="parent";
  if(step===1){
    app.innerHTML=`<div class="panel">${bar}<h2>Who’s joining LingoBuddy?</h2><div class="roles">
     <button class="role" data-r="parent" aria-pressed="${p}"><span class="e">🧑‍🍼</span><b>I’m a parent</b><small>Support my child</small></button>
     <button class="role" data-r="child" aria-pressed="${reg.role==="child"}"><span class="e">🧒</span><b>I’m a child</b><small>I want to learn</small></button></div>
     <div class="err" id="err"></div><div class="row"><button class="btn ghost" id="b">Back</button><button class="btn" id="n">Continue</button></div></div>`;
    app.querySelectorAll(".role").forEach(b=>b.onclick=()=>{reg.role=b.dataset.r;register(1)});
    document.getElementById("b").onclick=landing;
    document.getElementById("n").onclick=()=>reg.role?register(2):document.getElementById("err").textContent="Please choose parent or child.";
  }
  if(step===2){
    app.innerHTML=`<div class="panel">${bar}<h2>${p?"Create your parent account":"Create your learner profile"}</h2>
     <label for="name">${p?"Your name":"Pick a nickname (not your real name)"}</label><input id="name" maxlength="30" autocomplete="off">
     ${p?`<label for="email">Email</label><input id="email" type="email">`:""}
     <label for="age">${p?"Your child’s age group":"How old are you?"}</label><select id="age"><option>5–8</option><option>9–12</option><option>13–17</option></select>
     <label for="pw">Password</label><input id="pw" type="password" placeholder="At least 6 characters" autocomplete="new-password">
     ${p?"":`<div class="note">🛟 Under 13? Ask a parent or guardian to help. Never share your real name, address or school.</div>`}
     <div class="err" id="err"></div><div class="row"><button class="btn ghost" id="b">Back</button><button class="btn" id="n">Continue</button></div></div>`;
    document.getElementById("b").onclick=()=>register(1);
    document.getElementById("n").onclick=async()=>{
      const name=document.getElementById("name").value.trim(),email=p?document.getElementById("email").value.trim():"",pw=document.getElementById("pw").value,err=document.getElementById("err");
      const id=p?email:name;
      if(!name)return err.textContent="Please enter a name.";
      if(p&&!/^\S+@\S+\.\S+$/.test(email))return err.textContent="Please enter a valid email.";
      if(pw.length<6)return err.textContent="Password needs at least 6 characters.";
      if(accounts()[keyOf(id)])return err.textContent="That account already exists – try logging in.";
      Object.assign(reg,{name,id,age:document.getElementById("age").value,hash:await hash(keyOf(id)+pw)});
      register(3);
    };
  }
  if(step===3){
    app.innerHTML=`<div class="panel">${bar}<h2>Your languages</h2>
     <label for="nat">The language I speak</label><select id="nat">${opts(NATIVE,"English")}</select>
     <label for="lang">${p?"Language my child will learn":"Language I want to learn"}</label><select id="lang">${opts(LEARN,"Spanish")}</select>
     <label for="lvl">Level</label><select id="lvl"><option>Complete beginner</option><option>I know a few words</option><option>I can have simple chats</option></select>
     <div class="note">Your buddy will talk to you in the language you speak and teach the new language along the way.</div>
     <div class="err" id="err"></div><div class="row"><button class="btn ghost" id="b">Back</button><button class="btn" id="n">Create account</button></div></div>`;
    document.getElementById("b").onclick=()=>register(2);
    document.getElementById("n").onclick=()=>{
      const native=document.getElementById("nat").value,lang=document.getElementById("lang").value;
      if(native===lang)return document.getElementById("err").textContent="Please choose two different languages.";
      const a={role:reg.role,name:reg.name,id:reg.id,age:reg.age,hash:reg.hash,native,lang,level:document.getElementById("lvl").value};
      const all=accounts();all[keyOf(a.id)]=a;ls.set("lingo_accounts",all);start(a);
    };
  }
}

function start(a){me=a;ls.set("lingo_session",keyOf(a.id));chats=ls.get("lingo_chats_"+keyOf(a.id),[]);cur=null;dash();chats.length?openChat(chats[0].id):newChat()}
function logout(){me=null;chats=[];cur=null;ls.del("lingo_session");landing()}

function persona(){
  const p=me.role==="parent",base=`You are LingoBuddy, a friendly, patient AI language tutor. The learner’s native language is ${me.native}; they are learning ${me.lang} at this level: ${me.level}. ALWAYS write your conversation and explanations in ${me.native}, and teach ${me.lang} by giving example words and phrases in ${me.lang}, each with a ${me.native} translation and a pronunciation hint (romanization for non-Latin scripts). Use more ${me.lang} as the learner improves. If the learner writes in ${me.lang}, praise them and correct mistakes gently, explaining in ${me.native}. If they write in any other language, still answer in ${me.native}. Keep replies under 120 words and end with one small practice prompt. Never ask for personal information.`;
  return p?base+` The user is a PARENT (${me.name}) helping a child aged ${me.age}: give practical tips and activities to practise together at home.`
          :base+` The user is a CHILD aged ${me.age} (nickname "${me.name}"). Use simple words, a warm playful tone and a few emojis. Keep everything strictly age-appropriate. If asked about anything unrelated to language learning, kindly steer back. If they share personal info (real name, address, school, phone) or seem upset or unsafe, remind them not to share it and to talk to a parent or trusted adult.`;
}

function dash(){
  const p=me.role==="parent";
  nav.innerHTML=`<span class="chip">${p?"🧑‍🍼 Parent":"🧒 Learner"}</span> <button class="link" id="out">Log out</button>`;
  document.getElementById("out").onclick=logout;
  app.innerHTML=`<div class="dash"><aside class="side">
    <div class="card"><b id="who"></b><br><span style="color:var(--muted)" id="langs"></span></div>
    <button class="btn" id="new">＋ New chat</button>
    <div class="card" style="margin-top:12px"><b>Past chats</b><div class="hist" id="hist"></div></div></aside>
   <section class="card chat"><div class="msgs" id="msgs" aria-live="polite"></div><div class="quick" id="quick"></div>
    <div class="composer"><input id="inp" placeholder="Type a message…" autocomplete="off" maxlength="500"><button class="btn" id="send">Send</button></div></section></div>`;
  document.getElementById("who").textContent=`${p?"Hi":"Hi"}, ${me.name}! 👋`;
  document.getElementById("langs").textContent=`${me.native} → learning ${me.lang}`;
  document.getElementById("new").onclick=newChat;
  document.getElementById("send").onclick=()=>ask();
  document.getElementById("inp").onkeydown=e=>{if(e.key==="Enter")ask()};
  const q=document.getElementById("quick");
  QUICK.forEach(([l,t])=>{const b=document.createElement("button");b.textContent=l;b.onclick=()=>ask(t,l);q.appendChild(b)});
}

function renderHist(){
  const h=document.getElementById("hist");h.textContent="";
  if(!chats.length){h.textContent="No chats yet.";return}
  chats.forEach(c=>{
    const d=document.createElement("div");d.className="h"+(cur&&c.id===cur.id?" on":"");
    const o=document.createElement("button");o.className="o";o.onclick=()=>openChat(c.id);
    const t=document.createElement("span");t.className="t";t.textContent=c.title;
    const s=document.createElement("small");s.textContent=new Date(c.ts).toLocaleDateString(undefined,{month:"short",day:"numeric"})+" · "+c.msgs.filter(m=>!m.h).length+" msgs";
    o.append(t,s);
    const x=document.createElement("button");x.className="x";x.textContent="✕";x.setAttribute("aria-label","Delete chat");
    let armed=false;x.onclick=()=>{if(!armed){armed=true;x.textContent="Delete?";x.style.color="#d6336c";x.style.fontWeight="800";setTimeout(()=>{armed=false;x.textContent="✕";x.style.color="";x.style.fontWeight=""},3000);return}chats=chats.filter(z=>z.id!==c.id);saveChats();if(cur&&cur.id===c.id){chats.length?openChat(chats[0].id):newChat()}else renderHist()};
    d.append(o,x);h.appendChild(d);
  });
}
function addMsg(who,text){const m=document.createElement("div");m.className="b "+who;m.textContent=text;const b=document.getElementById("msgs");b.appendChild(m);b.scrollTop=b.scrollHeight;return m}
function openChat(id){
  cur=chats.find(c=>c.id===id);const b=document.getElementById("msgs");b.textContent="";
  cur.msgs.filter(m=>!m.h).forEach(m=>addMsg(m.r==="user"?"me":"bot",m.l||m.c));renderHist();
}
async function newChat(){
  if(busy)return;
  cur={id:"c"+Date.now(),title:"New chat",ts:Date.now(),msgs:[]};chats.unshift(cur);
  document.getElementById("msgs").textContent="";
  cur.msgs.push({r:"user",c:`Greet me warmly by name (${me.name}) in ${me.native}, say you’ll help me learn ${me.lang}, and suggest two things we could start with.`,h:1});
  renderHist();await reply();
}
async function ask(text,label){
  const inp=document.getElementById("inp");text=(text||inp.value).trim();
  if(!text||busy||!cur)return;inp.value="";
  cur.msgs.push({r:"user",c:text,l:label});addMsg("me",label||text);
  if(cur.title==="New chat")cur.title=(label||text).slice(0,40);
  await reply();
}
async function reply(){
  const bot=addMsg("bot","Thinking…");busy=true;const chat=cur;
  try{
    if(!sampleFn)sampleFn=await claude.use("sample");
    if(!sampleFn){bot.textContent="The assistant isn’t available right now.";chat.msgs.pop();return}
    const msgs=chat.msgs.slice(-14).map(m=>({role:m.r,content:m.c}));
    if(msgs[0].role!=="user")msgs.shift();
    msgs[0].content="[Instructions: "+persona()+"]\n\n"+msgs[0].content;
    const r=await sampleFn(msgs,{cache:false,onText:({text})=>{bot.textContent=text;const b=document.getElementById("msgs");b.scrollTop=b.scrollHeight}});
    bot.textContent=r.text;chat.msgs.push({r:"assistant",c:r.text});
  }catch(e){
    bot.textContent=e&&e.code==="rate_limited"?"I need a short rest – please try again in a moment!":"Oops, something went wrong. Please try again.";
    if(chat.msgs[chat.msgs.length-1].r==="user")chat.msgs.pop();
  }finally{busy=false;chat.ts=Date.now();saveChats();if(chats.includes(chat)){chats.sort((a,b)=>b.ts-a.ts);renderHist()}}
}

document.getElementById("home").onclick=()=>me?null:landing();
(function(){const k=ls.get("lingo_session",null),a=k&&accounts()[k];a?start(a):landing()})();
</script>
</body>
</html>
